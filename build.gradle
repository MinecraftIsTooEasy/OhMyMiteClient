plugins {
    id 'fml-loom' version '0.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def useLocalizedArchiveName = Locale.default.country.equalsIgnoreCase("CN")

base {
    // Prefix local JAR names with an optional alias, for example: "[Alias]" + archives_base_name.
    // Maven publishing keeps using the lowercase maven_id configured below.
    archivesName = useLocalizedArchiveName
            ? "[MITE生电]${project.archives_base_name}"
            : project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // Only declare repositories required by this project because Loom provides
    // the repositories needed for Minecraft and its libraries automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repository declarations.
    mavenLocal()
    maven {
        name = "Spongepowered"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
    maven {
        name = "ModdedMITE"
        url = uri("https://maven.limingzxc.top/repository/maven-public/")
    }
}

configurations {
    fml
}

dependencies {
    // Dependency versions are maintained in gradle.properties or alongside project-specific declarations below.
    // Use implementation for required mods, compileOnly for optional integrations,
    // and localRuntime for mods needed only in the development environment.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // This project uses loader_version for FishModLoader.
    fml "com.github.MinecraftIsTooEasy:FishModLoader:${project.loader_version}"
    implementation "com.github.MinecraftIsTooEasy:FishModLoader:${project.loader_version}"

    // The most basic dependency library mod, with a status similar to Fabric API
    implementation "org.moddedmite:rusted-iron-core:1.5.7"
    implementation "com.github.MinecraftIsTooEasy:ManyLib:2.3.1"

    // Optional mod integrations.
    compileOnly "com.github.MinecraftIsTooEasy:ModMenu:10.1.1"
    compileOnly "com.github.MinecraftIsTooEasy:EMI:1.1.27"

    // Mods needed only in the development environment.
    localRuntime "com.github.MinecraftIsTooEasy:Gson:2.10.1"
    localRuntime "com.github.MinecraftIsTooEasy:FastUtil:8.5.12"
    localRuntime "com.github.MinecraftIsTooEasy:EMI:1.1.27"
    localRuntime "org.moddedmite:modern-mite:3.8.0"

    // To add strong dependencies, use "implementation" like above
    // To compile mod integrations(e.g. ModMenu), use "compileOnly"
    // To add mods for running client, use "localRuntime"
}

def fmlResolvedFile = configurations.fml.singleFile

loom {
    accessWidenerPath = file("src/main/resources/ommc.accesswidener")
    mergedMinecraftJar()
    setFML(fmlResolvedFile)
    dependencies.add("mappings", fmlMCPMappings())
    mods {
        "ommc" {
            sourceSet sourceSets.main
//            sourceSet sourceSets.client
//            sourceSet sourceSets.server
//            For modules in the 'src' directory, only the main source set is required by default.
        }
    }
    runs {
        client {
            String name = project.username
            String width = project.screen_width
            String height = project.screen_height
            programArgs "--userProperties", "{}", "--username", name, "--session", "0", "--width", width, "--height", height
        }
//        server {
//            programArgs "--", ""
//        }
    }
}

processResources {
    inputs.properties(
            version: project.version,
            id: project.mod_id,
            name: project.mod_name
    )

    filesMatching("fml.mod.json") {
        expand(inputs.properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

java {
    // Loom automatically attaches sourcesJar to remapSourcesJar and the build lifecycle when it is present.
    // Remove this line only when source artifacts should not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { String fileName -> "${fileName}_${inputs.properties.archivesName}" }
    }
}

// Configure the Maven publication.
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.maven_id
            from(components.java)
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.

        // ModdedMITE release repository.
        maven {
            name = "ModdedMITE"
            url = uri("https://maven.limingzxc.top/repository/maven-releases/")
            credentials {
                // Read only from gradle.properties (user level, your gradle_home)
                username = project.findProperty("nexusUsername")
                password = project.findProperty("nexusPassword")
            }
        }
    }
}
